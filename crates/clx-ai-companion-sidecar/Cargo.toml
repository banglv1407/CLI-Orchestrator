[package]
name = "clx-ai-companion-sidecar"
version = "0.1.0"
edition = "2021"
description = "Bounded out-of-process AI Companion sidecar for CLX"
license = "MIT"

[dependencies]
chrono = "0.4"
dirs = "6.0"
futures-util = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.43", features = ["full"] }
tokio-util = "0.7"
uuid = { version = "1.12", features = ["v4"] }
