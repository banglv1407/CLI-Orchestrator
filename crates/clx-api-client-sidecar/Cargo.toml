[package]
name = "clx-api-client-sidecar"
version = "0.1.0"
edition = "2021"
description = "Signed API Client HTTP runtime for CLX modular distribution"
license = "MIT"

[[bin]]
name = "clx-api-client-sidecar"
path = "src/main.rs"

[dependencies]
futures-util = "0.3"
reqwest = { version = "0.12", features = ["stream"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.43", features = ["macros", "rt-multi-thread", "sync", "time"] }
tokio-util = { version = "0.7", features = ["rt"] }
uuid = { version = "1.12", features = ["v4"] }
