[package]
name = "clx-local-llm-sidecar"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "clx-local-llm-sidecar"
path = "src/main.rs"

[dependencies]
candle-core = { version = "0.8.2" }
candle-transformers = { version = "0.8.2" }
dirs = "5.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokenizers = { version = "0.21.0" }
tokio = { version = "1.43", features = ["full"] }
tokio-util = "0.7"
uuid = "1.12"
