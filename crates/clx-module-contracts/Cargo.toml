[package]
name = "clx-module-contracts"
version = "0.1.0"
edition = "2021"
description = "Versioned contracts and fail-closed verification for CLX first-party modules"
license = "MIT"

[dependencies]
base64 = "0.22"
ed25519-dalek = "2.1"
semver = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
thiserror = "2.0"

[dev-dependencies]
tempfile = "3.14"

