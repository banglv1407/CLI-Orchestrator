[package]
name = "clx-module-host"
version = "0.1.0"
edition = "2021"
description = "Fail-closed discovery, lifecycle, entitlement and sidecar host for CLX modules"
license = "MIT"

[dependencies]
async-trait = "0.1"
clx-module-contracts = { path = "../clx-module-contracts" }
semver = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.43", features = ["macros", "process", "io-util", "rt", "sync", "time"] }
uuid = { version = "1.12", features = ["v4"] }

[dev-dependencies]
base64 = "0.22"
ed25519-dalek = "2.1"
sha2 = "0.10"
tempfile = "3.14"
