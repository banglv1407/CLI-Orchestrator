[package]
name = "clx-quickapps-sidecar"
version = "0.1.0"
edition = "2021"
description = "Signed Quick Apps native runtime for CLX modular distribution"
license = "MIT"

[[bin]]
name = "clx-quickapps-sidecar"
path = "src/main.rs"

[dependencies]
base64 = "0.22"
dirs = "6.0"
hex = "0.4"
image = { version = "0.25", default-features = false, features = ["png"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
thiserror = "2.0"
windows-sys = { version = "0.52", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_UI_Shell", "Win32_Graphics_Gdi"] }

