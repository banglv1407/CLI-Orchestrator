[package]
name = "clx-ssh-sidecar"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "clx-ssh-sidecar"
path = "src/main.rs"

[dependencies]
async-trait = "0.1"
chrono = { version = "0.4", features = ["serde"] }
dirs = "5.0"
russh = "0.62.1"
russh-keys = "0.49.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.43", features = ["full"] }
tokio-util = "0.7"
uuid = "1.12"
