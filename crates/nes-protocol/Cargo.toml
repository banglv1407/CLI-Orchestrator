[package]
name = "nes-protocol"
version = "0.1.0"
edition = "2021"
description = "Shared NES multiplayer wire contracts: versioned DTOs, signaling envelope validation, NIP-98 events, controller bitmask"
license = "MIT"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
sha2 = "0.10"
hex = "0.4"
k256 = { version = "0.13", features = ["schnorr"] }
