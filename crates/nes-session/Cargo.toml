[package]
name = "nes-session"
version = "0.1.0"
edition = "2021"
description = "NES multiplayer session service: NIP-98 room API and input-only WebSocket relay"
license = "MIT"

[[bin]]
name = "nes-session"
path = "src/main.rs"

[dependencies]
nes-protocol = { path = "../nes-protocol" }
axum = { version = "0.8", features = ["json", "ws"] }
tokio = { version = "1.43", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1.12", features = ["v4"] }
rand = "0.10.2"
sha2 = "0.10"
hex = "0.4"
base64 = "0.22"
futures-util = "0.3"
tower-http = { version = "0.6", features = ["cors", "trace"] }

[dev-dependencies]
reqwest = { version = "0.12", features = ["json"] }
tokio-tungstenite = "0.29"
