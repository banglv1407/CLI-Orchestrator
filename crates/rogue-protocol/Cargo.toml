[package]
name = "rogue-protocol"
version = "0.1.0"
edition = "2021"
description = "Protocol types and signaling schemas for Project Rogue Node cyber deduction game"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
k256 = { version = "0.13", features = ["schnorr"] }
sha2 = "0.10"
hex = "0.4"
base64 = "0.22"
