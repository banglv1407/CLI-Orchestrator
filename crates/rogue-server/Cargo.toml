[package]
name = "rogue-server"
version = "0.1.0"
edition = "2021"
description = "Authoritative WebSocket game server for Project Rogue Node"

[dependencies]
rogue-protocol = { path = "../rogue-protocol" }
axum = { version = "0.7", features = ["ws"] }
tokio = { version = "1.0", features = ["full"] }
tokio-tungstenite = "0.21"
tower-http = { version = "0.5", features = ["cors", "trace"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
rand = "0.8"
futures-util = "0.3"
parking_lot = "0.12"
