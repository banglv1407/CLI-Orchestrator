[package]
name = "clx"
version = "0.2.0"
description = "Desktop orchestrator for AI CLI tools"
authors = ["CLX Devs"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2.0", features = [] }

[dependencies]
tauri = { version = "2.0", features = ["tray-icon", "unstable"] }
tokio = { version = "1.43", features = ["macros", "rt-multi-thread", "process", "io-util", "sync", "time"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
dirs = "6.0"
portable-pty = "0.8"
uuid = { version = "1.12", features = ["v4", "serde"] }
which = "8.0"
rfd = "0.15"
tauri-plugin-dialog = "2.6.0"
rusqlite = { version = "0.32", features = ["bundled"] }
sha2 = "0.10"
hex = "0.4"
zstd = "0.13"
tar = "0.4"
chrono = { version = "0.4", features = ["serde"] }
futures-util = "0.3"
bytes = "1.10"
base64 = "0.22"
tokio-util = { version = "0.7", features = ["rt"] }
zeroize = "1.8"
tokio-tungstenite = { version = "0.26", features = ["native-tls"] }
reqwest = { version = "0.12", features = ["json", "blocking", "stream", "socks"] }
image = { version = "0.25", default-features = false, features = ["png"] }
ico = "0.3"
windows-sys = { version = "0.52", features = ["Win32_Foundation", "Win32_Security_Credentials", "Win32_System_Diagnostics_ToolHelp", "Win32_System_ProcessStatus", "Win32_System_SystemInformation", "Win32_System_Threading", "Win32_UI_WindowsAndMessaging", "Win32_UI_Shell", "Win32_Graphics_Gdi", "Win32_Storage_FileSystem"] }
russh = "0.62.1"
russh-keys = "0.49.2"
rand = "0.10.2"
regex = "1.12"

axum = { version = "0.8", features = ["json"] }
tower-http = { version = "0.6", features = ["cors"] }
tower = { version = "0.5", features = ["util"] }

# NES multiplayer shared wire contracts (D:\CLI-Ochestor\crates\nes-protocol)
nes-protocol = { path = "../crates/nes-protocol" }
k256 = { version = "0.13", features = ["schnorr"] }

# Built-in LLM dependencies (optional)
candle-core = { version = "0.8.2", optional = true }
candle-transformers = { version = "0.8.2", optional = true }
tokenizers = { version = "0.21.0", optional = true }

[features]
default = ["custom-protocol", "builtin-llm"]
custom-protocol = ["tauri/custom-protocol"]
builtin-llm = ["dep:candle-core", "dep:candle-transformers", "dep:tokenizers"]
