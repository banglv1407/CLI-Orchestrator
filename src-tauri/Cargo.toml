[package]
name = "clx"
version = "0.1.0"
description = "Desktop orchestrator for AI CLI tools"
authors = ["CLX Devs"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2.0", features = [] }

[dependencies]
async-trait = "0.1"
clx-module-contracts = { path = "../crates/clx-module-contracts" }
clx-module-host = { path = "../crates/clx-module-host" }
tauri = { version = "2.0", features = ["tray-icon", "unstable"] }
tokio = { version = "1.43", features = ["macros", "rt-multi-thread", "process", "io-util", "sync", "time"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
dirs = "6.0"
portable-pty = "0.8"
uuid = { version = "1.12", features = ["v4", "serde"] }
which = "8.0"
rfd = "0.15"
tauri-plugin-dialog = "2.6.0"
rusqlite = { version = "0.32", features = ["bundled"] }
sha2 = "0.10"
hex = "0.4"
zstd = "0.13"
tar = "0.4"
chrono = { version = "0.4", features = ["serde"] }
futures-util = "0.3"
bytes = "1.10"
base64 = "0.22"
tokio-util = { version = "0.7", features = ["rt"] }
zeroize = "1.8"
reqwest = { version = "0.12", features = ["json", "blocking", "stream"] }
image = { version = "0.25", default-features = false, features = ["png"] }
windows-sys = { version = "0.52", features = ["Win32_Foundation", "Win32_Security_Credentials", "Win32_System_Diagnostics_ToolHelp", "Win32_System_ProcessStatus", "Win32_System_SystemInformation", "Win32_System_Threading", "Win32_UI_WindowsAndMessaging", "Win32_Storage_FileSystem"] }
rand = "0.10.2"
regex = "1.12"
clx-ssh-client = { path = "../crates/clx-ssh-client" }

axum = { version = "0.8", features = ["json"] }
tower-http = { version = "0.6", features = ["cors"] }
tower = { version = "0.5", features = ["util"] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
