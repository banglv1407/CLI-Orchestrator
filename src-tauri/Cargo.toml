[package]
name = "clx"
version = "0.1.0"
description = "Desktop orchestrator for AI CLI tools"
authors = ["CLX Devs"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2.0", features = [] }

[dependencies]
tauri = { version = "2.0", features = ["tray-icon"] }
tokio = { version = "1.43", features = ["macros", "rt-multi-thread", "process", "io-util", "sync"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
dirs = "6.0"
portable-pty = "0.8"
uuid = { version = "1.12", features = ["v4", "serde"] }
which = "8.0"
rfd = "0.15"
tauri-plugin-dialog = "2.6.0"
rusqlite = { version = "0.32", features = ["bundled"] }
sha2 = "0.10"
hex = "0.4"
chrono = { version = "0.4", features = ["serde"] }
reqwest = { version = "0.12", features = ["json", "blocking"] }
image = { version = "0.25", default-features = false, features = ["png"] }
ico = "0.3"
windows-sys = { version = "0.52", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_UI_Shell", "Win32_Graphics_Gdi", "Win32_Storage_FileSystem"] }
russh = "0.62.1"
russh-keys = "0.49.2"
rand = "0.10.2"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
